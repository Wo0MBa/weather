<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 Радар Вероятностей Вумбыча</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 1200px; width: 100%; }
        h1 { color: #38bdf8; border-bottom: 2px solid #38bdf8; padding-bottom: 10px; text-align: center; }
        h2 { color: #94a3b8; margin-top: 40px; margin-bottom: 20px; width: 100%; text-align: left; border-left: 4px solid #38bdf8; padding-left: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 10px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); position: relative; }
        .city-name { font-size: 1.3em; font-weight: bold; margin-bottom: 5px; color: #e2e8f0; display: flex; justify-content: space-between; }
        .icao { font-size: 0.7em; color: #64748b; }
        .temp-row { display: flex; align-items: baseline; gap: 10px; margin: 10px 0; }
        .temp-live { font-size: 3em; font-weight: bold; color: #38bdf8; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.95em; border-top: 1px solid #334155; padding-top: 10px; margin-bottom: 15px; }
        
        .prob-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .prob-box { text-align: center; padding: 12px 5px; border-radius: 8px; font-weight: bold; font-size: 0.85em; }
        .prob-label { font-size: 0.7em; display: block; margin-bottom: 4px; opacity: 0.8; }
        
        .prob-high { background-color: #064e3b; color: #34d399; border: 1px solid #059669; }
        .prob-mid { background-color: #451a03; color: #fbbf24; border: 1px solid #b45309; }
        .prob-low { background-color: #450a0a; color: #f87171; border: 1px solid #991b1b; }
        .prob-boil { background-color: #7f1d1d; color: #fef2f2; border: 1px solid #ef4444; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .trend-up { color: #10b981; }
        .trend-down { color: #f43f5e; }
        .updated { font-size: 0.75em; color: #64748b; text-align: right; margin-top: 15px; }
    </style>
    <script>
        function getProbClass(p) {
            if (p >= 90) return 'prob-boil';
            if (p > 75) return 'prob-high';
            if (p > 45) return 'prob-mid';
            return 'prob-low';
        }
        function getProbText(p) {
            if (p >= 90) return '🔥 ХИТ';
            if (p > 75) return 'ВЫСОКИЙ';
            if (p > 45) return 'СРЕДНИЙ';
            return 'НИЗКИЙ';
        }

        function createCard(info) {
            const card = document.createElement('div');
            card.className = 'card';
            const t1 = Math.ceil(info.current + 0.01);
            const t2 = t1 + 1;
            let skyRu = info.sky;
            if(skyRu === 'Clear') skyRu = 'Ясно';
            else if(skyRu === 'P.Cloudy') skyRu = 'Пер. обл.';
            else if(skyRu === 'Cloudy') skyRu = 'Облачно';

            card.innerHTML = `
                <div class="city-name">${info.name} <span class="icao">${info.code}</span></div>
                <div class="temp-row">
                    <span class="temp-live">${info.current.toFixed(1)}°C</span>
                </div>
                <div class="stats-grid">
                    <div>Тренд: <span class="${info.trend >= 0 ? 'trend-up' : 'trend-down'}">${info.trend >= 0 ? '+' : ''}${info.trend}°/ч</span></div>
                    <div>Небо: <span>${skyRu || 'Н/А'}</span></div>
                </div>
                <div class="prob-container">
                    <div class="prob-box ${getProbClass(info.prob1)}">
                        <span class="prob-label">Шанс на ${t1}°C</span>
                        ${getProbText(info.prob1)}: ${info.prob1}%
                    </div>
                    <div class="prob-box ${getProbClass(info.prob2)}">
                        <span class="prob-label">Шанс на ${t2}°C</span>
                        ${getProbText(info.prob2)}: ${info.prob2}%
                    </div>
                </div>
                <div class="updated">Обновлено: ${info.updated}</div>
            `;
            return card;
        }

        async function updateRadar() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();
                
                const asiaGrid = document.getElementById('asia-grid');
                const euGrid = document.getElementById('eu-grid');
                asiaGrid.innerHTML = '';
                euGrid.innerHTML = '';

                const asiaCities = Object.values(data).filter(c => c.region === 'ASIA').sort((a, b) => (b.prob1 || 0) - (a.prob1 || 0));
                const euCities = Object.values(data).filter(c => c.region === 'EUROPE').sort((a, b) => (b.prob1 || 0) - (a.prob1 || 0));

                asiaCities.forEach(c => asiaGrid.appendChild(createCard(c)));
                euCities.forEach(c => euGrid.appendChild(createCard(c)));

            } catch (e) { console.error("Sync error", e); }
        }
        setInterval(updateRadar, 30000);
        window.onload = updateRadar;
    </script>
</head>
<body>
    <div class="container">
        <h1>🌀 Радар Вероятностей Вумбыча</h1>
        
        <h2>Азия / Asia</h2>
        <div id="asia-grid" class="grid">
            <div style="text-align: center; grid-column: 1/-1;">Загрузка Азии...</div>
        </div>

        <h2>Европа / Europe</h2>
        <div id="eu-grid" class="grid">
            <div style="text-align: center; grid-column: 1/-1;">Загрузка Европы...</div>
        </div>
    </div>
</body>
</html>
